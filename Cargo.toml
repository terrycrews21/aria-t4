[package]
name = "ariaminer"
version = "0.6.4"
edition = "2024"
license = "LicenseRef-Proprietary"
description = "ARIAMiner GPU — Blackwell-native Pearl (PRL) miner. Canonical GEMM Int7×Int7 proof-of-work on the IMMA int8 tensor cores. 1% dev-fee (announced)."
repository = "https://github.com/stefancrypto68/ariaminer"
readme = "README.md"
keywords = ["pearl", "mining", "cpu", "miner", "crypto"]
categories = ["command-line-utilities"]
build = "build.rs"

[features]
# v0.4.0 : chemin GPU (kernel CuTe IMMA + fold jackpot + pow-check via libpearl_gpu).
# OFF par défaut → le miner CPU reste buildable sans CUDA.
gpu = []

[[bin]]
name = "ariaminer"
path = "src/bin/ariaminer.rs"

[[bin]]
name = "gpu_smoke"
path = "src/bin/gpu_smoke.rs"
required-features = ["gpu"]

[[bin]]
name = "gpu_live"
path = "src/bin/gpu_live.rs"
required-features = ["gpu"]

[[bin]]
name = "commit_check"
path = "src/bin/commit_check.rs"
required-features = ["gpu"]

[[bin]]
name = "commit_seeds_check"
path = "src/bin/commit_seeds_check.rs"
required-features = ["gpu"]

[[bin]]
name = "resident_bench"
path = "src/bin/resident_bench.rs"
required-features = ["gpu"]

[[bin]]
name = "resident_bench2"
path = "src/bin/resident_bench2.rs"
required-features = ["gpu"]

[[bin]]
name = "noise_check"
path = "src/bin/noise_check.rs"
required-features = ["gpu"]

[[bin]]
name = "alphapool_miner"
path = "src/bin/alphapool_miner.rs"
required-features = ["gpu"]

[[bin]]
name = "alphapool_probe"
path = "src/bin/alphapool_probe.rs"

[[bin]]
name = "proof_check"
path = "src/bin/proof_check.rs"
required-features = ["gpu"]

[[bin]]
name = "proof_check_fixb"
path = "src/bin/proof_check_fixb.rs"
required-features = ["gpu"]

[[bin]]
name = "proof_check_131k"
path = "src/bin/proof_check_131k.rs"
required-features = ["gpu"]

[[bin]]
name = "alphapool_prod_131k"
path = "src/bin/alphapool_prod_131k.rs"
required-features = ["gpu"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
base64 = "0.22"
bincode = "1.3"
blake3 = "1"
rand = "0.8"
chrono = "0.4"
parking_lot = "0.12"
sha2 = "0.10"
rayon = "1"

# Pearl's official reference crates (public). Used for canonical noise/proof
# generation and the BLAKE3 Merkle commitment — fetched by cargo from Pearl's
# public repo, nothing is vendored.
zk-pow = { git = "https://github.com/pearl-research-labs/pearl.git" }
pearl-blake3 = { git = "https://github.com/pearl-research-labs/pearl.git" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
